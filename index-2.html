<html lang="fr">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>

<noscript><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/></noscript>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#070E17;
  --bg2:#0B1622;
  --bg3:#101E2E;
  --card:rgba(11,22,34,0.97);
  --accent:#FF6B2B;
  --accent2:#FF8C5A;
  --blue:#3B9EFF;
  --green:#00D37F;
  --red:#FF3D5A;
  --yellow:#FFB340;
  --purple:#8B5CF6;
  --border:rgba(255,107,43,0.15);
  --border2:rgba(255,255,255,0.06);
  --text:#F0F6FF;
  --text2:#8899AA;
  --text3:#445566;
  --shadow:0 8px 40px rgba(0,0,0,0.6);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans','Segoe UI',sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:'Plus Jakarta Sans','Segoe UI',sans-serif;cursor:pointer}
input,select,textarea{font-family:'Plus Jakarta Sans','Segoe UI',sans-serif}
a{color:inherit;text-decoration:none}
svg{display:block;flex-shrink:0}

/* SCROLLBAR */
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,107,43,0.25);border-radius:4px}

/* ANIMATIONS */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(255,107,43,0.3)}50%{box-shadow:0 0 40px rgba(255,107,43,0.6)}}
@keyframes ripple{0%{transform:scale(0);opacity:0.4}100%{transform:scale(4);opacity:0}}
@keyframes badgePop{0%{transform:scale(0.5)}70%{transform:scale(1.15)}100%{transform:scale(1)}}

/* LAYOUT */
#app{min-height:100vh}
.page{display:none;flex-direction:column;min-height:100vh}
.page.active{display:flex}

/* CARDS */
.card{
  background:var(--card);
  border:1px solid var(--border2);
  border-radius:18px;
  padding:20px;
  backdrop-filter:blur(16px);
  transition:border-color 0.2s;
}
.card-glow{border-color:rgba(255,107,43,0.25);box-shadow:0 0 0 1px rgba(255,107,43,0.05),inset 0 1px 0 rgba(255,255,255,0.05)}

/* INPUTS */
.inp{
  width:100%;
  background:rgba(7,14,23,0.8);
  border:1px solid var(--border2);
  border-radius:12px;
  padding:13px 16px;
  color:var(--text);
  font-size:14px;
  font-weight:500;
  outline:none;
  transition:border-color 0.2s,box-shadow 0.2s;
}
.inp:focus{border-color:rgba(255,107,43,0.4);box-shadow:0 0 0 3px rgba(255,107,43,0.08)}
.inp::placeholder{color:var(--text3)}
select.inp option{background:#0B1622;color:var(--text)}
textarea.inp{resize:vertical;min-height:80px}
.inp-wrap{position:relative}
.inp-wrap .inp-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}
.inp-wrap .inp{padding-left:42px}

/* BUTTONS */
.btn{
  border:none;
  border-radius:12px;
  padding:13px 24px;
  font-weight:700;
  font-size:14px;
  cursor:pointer;
  color:#fff;
  transition:transform 0.15s,opacity 0.15s,box-shadow 0.15s;
  position:relative;
  overflow:hidden;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}
.btn:active{transform:scale(0.97)}
.btn:disabled{opacity:0.45;cursor:not-allowed;transform:none}
.btn-primary{background:linear-gradient(135deg,#FF6B2B,#FF4500);box-shadow:0 4px 20px rgba(255,107,43,0.35)}
.btn-primary:hover:not(:disabled){box-shadow:0 6px 28px rgba(255,107,43,0.5)}
.btn-green{background:linear-gradient(135deg,#00D37F,#00A062);box-shadow:0 4px 20px rgba(0,211,127,0.3)}
.btn-blue{background:linear-gradient(135deg,#3B9EFF,#2563EB);box-shadow:0 4px 20px rgba(59,158,255,0.3)}
.btn-purple{background:linear-gradient(135deg,#8B5CF6,#6D28D9);box-shadow:0 4px 20px rgba(139,92,246,0.3)}
.btn-red{background:linear-gradient(135deg,#FF3D5A,#DC2626);box-shadow:0 4px 20px rgba(255,61,90,0.3)}
.btn-ghost{background:rgba(255,255,255,0.05);border:1px solid var(--border2);color:var(--text2)}
.btn-ghost:hover{background:rgba(255,255,255,0.08);color:var(--text)}
.btn-full{width:100%}
.btn-sm{padding:8px 16px;font-size:13px;border-radius:10px}
.btn-outline{background:transparent;border:1.5px solid var(--accent);color:var(--accent);border-radius:12px;padding:11px 22px;font-weight:700;font-size:14px;cursor:pointer;transition:all 0.2s;display:inline-flex;align-items:center;gap:8px}
.btn-outline:hover{background:rgba(255,107,43,0.08)}

/* BADGES */
.badge{border-radius:20px;padding:4px 11px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.tag{border-radius:8px;padding:3px 9px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:4px}

/* STATUS DOTS */
.dot-green{width:8px;height:8px;background:var(--green);border-radius:50%;display:inline-block;box-shadow:0 0 0 3px rgba(0,211,127,0.2)}
.dot-red{width:8px;height:8px;background:var(--red);border-radius:50%;display:inline-block}
.dot-yellow{width:8px;height:8px;background:var(--yellow);border-radius:50%;display:inline-block}

/* TOAST */
#toast{position:fixed;top:20px;right:20px;z-index:9999;display:none;animation:slideDown 0.3s ease;max-width:320px;min-width:220px}
#toast.show{display:flex;align-items:center;gap:10px;border-radius:14px;padding:13px 18px;font-weight:600;font-size:13px;box-shadow:0 8px 40px rgba(0,0,0,0.5);backdrop-filter:blur(20px)}

/* STICKY HEADER */
.sticky-header{
  background:rgba(7,14,23,0.92);
  border-bottom:1px solid var(--border2);
  padding:14px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:100;
  backdrop-filter:blur(24px);
}
.logo-mark{
  width:38px;height:38px;
  background:linear-gradient(135deg,#FF6B2B,#FF4500);
  border-radius:11px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  box-shadow:0 4px 16px rgba(255,107,43,0.4);
}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:200;
  background:rgba(7,14,23,0.97);
  border-top:1px solid var(--border2);
  backdrop-filter:blur(24px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.nav-inner{display:flex;max-width:600px;margin:0 auto}
.nav-btn{
  flex:1;padding:11px 8px 10px;background:none;border:none;cursor:pointer;
  color:var(--text3);display:flex;flex-direction:column;align-items:center;gap:4px;
  position:relative;transition:color 0.2s;
}
.nav-btn.active{color:var(--accent)}
.nav-btn .nav-label{font-size:10px;font-weight:700;letter-spacing:0.3px;text-transform:uppercase}
.nav-btn .nav-indicator{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:20px;height:2px;background:var(--accent);border-radius:2px 2px 0 0;opacity:0;transition:opacity 0.2s}
.nav-btn.active .nav-indicator{opacity:1}
.nav-badge{position:absolute;top:7px;right:18%;background:var(--red);color:#fff;border-radius:10px;font-size:9px;font-weight:800;padding:1px 5px;animation:badgePop 0.3s ease}

/* CONTENT */
.content{padding:18px;max-width:600px;margin:0 auto;padding-bottom:88px;flex:1;animation:fadeUp 0.3s ease}
.admin-content{padding:18px;max-width:740px;margin:0 auto;padding-bottom:88px;flex:1}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal-overlay.open{display:flex}
.modal-box{background:#0B1622;border:1px solid var(--border2);border-radius:20px;padding:24px;width:100%;max-width:480px;position:relative;max-height:90vh;overflow-y:auto;animation:slideUp 0.3s ease}
.modal-sheet{background:#0B1622;border:1px solid var(--border2);border-radius:22px 22px 0 0;padding:24px;width:100%;max-width:600px;max-height:92vh;overflow-y:auto;animation:slideUp 0.35s ease}
.modal-handle{width:36px;height:4px;background:rgba(255,255,255,0.12);border-radius:4px;margin:0 auto 20px}

/* AVATAR */
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}

/* REQUEST CARDS */
.req-card{margin-bottom:12px;animation:fadeUp 0.3s ease}

/* TECH CONTACT */
.tech-card{background:linear-gradient(135deg,rgba(0,211,127,0.06),rgba(59,158,255,0.04));border:1.5px solid rgba(0,211,127,0.25);border-radius:16px;overflow:hidden;animation:fadeUp 0.35s ease;margin-top:12px}

/* PROGRESS */
.progress-bar{background:rgba(255,255,255,0.06);border-radius:8px;height:5px;overflow:hidden;margin-top:10px}
.progress-fill{height:100%;border-radius:8px;transition:width 0.5s ease}

/* STEP DOTS */
.step-dot{width:8px;height:8px;border-radius:50%;transition:all 0.3s}

/* MAP */
#mapContainer{border-radius:18px;overflow:hidden;border:1px solid var(--border2);position:relative;box-shadow:var(--shadow)}
#leafletMap{height:340px;width:100%}

/* CHAT */
.chat-messages{min-height:260px;max-height:380px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 0;margin-bottom:12px}
.msg-bubble{max-width:75%;border-radius:16px;padding:10px 14px;font-size:14px;line-height:1.5;word-break:break-word}
.msg-me{background:linear-gradient(135deg,#FF6B2B,#FF4500);border-radius:16px 16px 4px 16px;margin-left:auto;box-shadow:0 2px 12px rgba(255,107,43,0.3)}
.msg-other{background:rgba(255,255,255,0.07);border:1px solid var(--border2);border-radius:16px 16px 16px 4px}
.msg-time{font-size:10px;color:rgba(255,255,255,0.35);margin-top:4px;text-align:right}
.msg-other .msg-time{text-align:left}

/* AUTH */
.auth-bg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at 30% 20%,rgba(255,107,43,0.08) 0%,transparent 60%),radial-gradient(ellipse at 70% 80%,rgba(59,158,255,0.06) 0%,transparent 60%),var(--bg)}
.auth-tabs{display:flex;background:rgba(255,255,255,0.04);border-radius:12px;padding:4px;margin-bottom:22px}
.auth-tab{flex:1;padding:10px;border-radius:10px;border:none;font-weight:700;font-size:13px;cursor:pointer;transition:all 0.2s;background:transparent;color:var(--text3)}
.auth-tab.active{background:rgba(255,107,43,0.15);color:var(--accent)}

/* PLAN CARDS */
.plan-card{border:2px solid var(--border2);border-radius:14px;padding:16px;cursor:pointer;transition:all 0.2s;position:relative;overflow:hidden}
.plan-card.selected{background:rgba(255,107,43,0.06)}
.plan-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent,rgba(255,255,255,0.01));pointer-events:none}

/* GRID */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* SPINNER */
.spinner{width:36px;height:36px;border:3px solid rgba(255,107,43,0.2);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite}

/* DIVIDER */
.divider{height:1px;background:var(--border2);margin:16px 0}

/* SECTION TITLE */
.section-title{font-size:13px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:10px;display:flex;align-items:center;gap:8px}

/* STAT CARD */
.stat-card{background:var(--card);border:1px solid var(--border2);border-radius:16px;padding:18px;text-align:center}
.stat-num{font-size:28px;font-weight:900;margin-bottom:4px;font-family:'Space Grotesk',sans-serif}
.stat-label{font-size:12px;color:var(--text2);font-weight:600}

/* URGENCY TOGGLE */
.urgency-btn{flex:1;padding:11px;border:2px solid var(--border2);border-radius:11px;font-weight:700;cursor:pointer;transition:all 0.2s;background:transparent;color:var(--text3)}
.urgency-btn.active-normal{border-color:#3B9EFF;background:rgba(59,158,255,0.08);color:#3B9EFF}
.urgency-btn.active-urgent{border-color:#FF3D5A;background:rgba(255,61,90,0.08);color:#FF3D5A}

/* PHOTO */
.photo-circle{width:72px;height:72px;border-radius:50%;overflow:hidden;border:2px dashed rgba(139,92,246,0.4);cursor:pointer;display:flex;align-items:center;justify-content:center;background:rgba(139,92,246,0.06);flex-shrink:0;transition:border-color 0.2s}
.photo-circle:hover{border-color:rgba(139,92,246,0.7)}
.photo-circle img{width:100%;height:100%;object-fit:cover}

/* PENDING / EXPIRED */
.centered-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at center,rgba(255,107,43,0.05),transparent 70%),var(--bg)}

/* ONLINE INDICATOR */
.online-ring{position:absolute;bottom:1px;right:1px;width:13px;height:13px;background:var(--green);border:2.5px solid var(--bg);border-radius:50%}

/* INFO ROW */
.info-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border2)}
.info-row:last-child{border-bottom:none;padding-bottom:0}
.info-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* FLOATING ACTION BUTTON */
.fab{position:fixed;bottom:90px;right:18px;z-index:190;width:58px;height:58px;border-radius:50%;border:none;background:linear-gradient(135deg,#FF3D5A,#DC2626);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 28px rgba(255,61,90,0.45);transition:transform 0.2s,box-shadow 0.2s;animation:glow 3s ease-in-out infinite}
.fab:active{transform:scale(0.93)}

/* NOTIFICATION BANNER */
.notif-banner{background:linear-gradient(135deg,rgba(0,211,127,0.12),rgba(0,211,127,0.04));border:1px solid rgba(0,211,127,0.25);border-radius:14px;padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;gap:12px}
.notif-banner.red{background:linear-gradient(135deg,rgba(255,61,90,0.1),rgba(255,61,90,0.03));border-color:rgba(255,61,90,0.25)}

/* HERO CARD */
.hero-card{background:linear-gradient(135deg,#0F1F35,#1A0E0A);border:1px solid rgba(255,107,43,0.2);border-radius:20px;padding:24px;margin-bottom:18px;position:relative;overflow:hidden}
.hero-card::after{content:'';position:absolute;top:-40px;right:-40px;width:160px;height:160px;background:radial-gradient(circle,rgba(255,107,43,0.15),transparent);pointer-events:none}

/* MISSION BADGE */
.mission-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(0,211,127,0.12);border:1px solid rgba(0,211,127,0.25);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700;color:var(--green)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

var supabase = null;

function loadSupabaseSDK(){
  return new Promise((resolve, reject) => {
    if(window.supabase && window.supabase.createClient){ resolve(); return; }
    // Check if already loading
    const existing = document.querySelector('script[data-supa]');
    if(existing){ existing.addEventListener('load',resolve); existing.addEventListener('error',reject); return; }
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';
    script.setAttribute('data-supa','1');
    script.crossOrigin = 'anonymous';
    script.onload = () => {
      if(window.supabase && window.supabase.createClient){ resolve(); }
      else { reject(new Error('SDK introuvable')); }
    };
    script.onerror = () => reject(new Error('Impossible de charger le SDK Supabase'));
    document.head.appendChild(script);
  });
}

function initSupabase(){
  try{
    supabase = window.supabase.createClient(SUPA_URL, SUPA_KEY, {
      auth:{
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: false,
        flowType: 'pkce'
      },
      global:{
        headers:{ 'X-Client-Info': 'panne-solution/1.0' }
      }
    });
    return true;
  } catch(e){ console.error('Supabase init:', e); return false; }
}

// ═══════════════════════════════════════════════════════════
//  DB LAYER
// ═══════════════════════════════════════════════════════════
var DB = (() => {
  let _cache = { users:{}, current:null, requests:[], messages:[], payments:[] };
  let _listeners = [];
  const notify = () => _listeners.forEach(fn=>{ try{fn()}catch(e){} });

  function mapProfile(r){
    if(!r) return null;
    return {
      id:r.id, name:r.name||r.full_name||'', email:r.email||'',
      role:r.role||'driver', phone:r.phone||'', specialty:r.specialty||'',
      garageName:r.garage_name||'', garageLocation:r.garage_location||'',
      location:r.location||r.garage_location||'Lomé, Togo',
      photoUrl:r.photo_url||null, plan:r.plan||'free',
      planStart:r.plan_start||Date.now(), planStatus:r.plan_status||'active',
      pendingPlan:r.pending_plan||null, pendingPaymentId:r.pending_payment_id||null,
      joinedAt:r.joined_at||Date.now(), rating:r.rating||0, completedJobs:r.completed_jobs||0,
    };
  }

  async function signUp(email, password, meta){
    const { data, error } = await supabase.auth.signUp({
      email, password,
      options:{ data: meta, emailRedirectTo: 'https://panne-solution.netlify.app' }
    });
    if(error) throw error;
    const uid = data.user.id;
    const profile = {
      id: uid, email, ...meta, plan:'free',
      plan_start:Date.now(), plan_status:'active',
      joined_at:Date.now(), rating:0, completed_jobs:0
    };
    const { error:pe } = await supabase.from('profiles').upsert(profile);
    if(pe) throw pe;
    _cache.current = mapProfile(profile);
    notify();
    return _cache.current;
  }

  async function signIn(email, password){
    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    if(error) throw error;
    const profile = await fetchProfile(data.user.id);
    _cache.current = profile;
    notify();
    return profile;
  }

  async function signOut(){
    await supabase.auth.signOut();
    localStorage.removeItem('ps_uid');
    _cache.current = null;
    notify();
  }

  async function fetchProfile(uid){
    const { data, error } = await supabase.from('profiles').select('*').eq('id', uid).single();
    if(error) throw error;
    return mapProfile(data);
  }

  async function loadRequests(){
    const { data, error } = await supabase.from('requests').select('*').order('created_at',{ascending:false});
    if(error){ const m=error?.message||error?.code||''; if(m.includes('42P01')||m.includes('does not exist')) console.error('Table requests manquante'); return _cache.requests; }
    _cache.requests = (data||[]).map(r=>({
      id:r.id, breakdownType:r.breakdown_type, techType:r.tech_type,
      location:r.location, description:r.description||'', urgency:r.urgency||'normal',
      userId:r.user_id, userName:r.user_name, userPhone:r.user_phone||'',
      status:r.status||'open', assignedTo:r.assigned_to||null, assignedName:r.assigned_name||null,
      createdAt:new Date(r.created_at).getTime(), lat:r.lat||null, lng:r.lng||null,
    }));
    return _cache.requests;
  }

  async function insertRequest(req){
    const { data, error } = await supabase.from('requests').insert({
      breakdown_type:req.breakdownType, tech_type:req.techType, location:req.location,
      description:req.description||'', urgency:req.urgency||'normal',
      user_id:req.userId, user_name:req.userName, user_phone:req.userPhone||'',
      status:'open', lat:req.lat||null, lng:req.lng||null,
      created_at:new Date().toISOString(),
    }).select().single();
    if(error) throw error;
    return data;
  }

  async function updateRequest(id, fields){
    const mapped = {};
    if(fields.status!==undefined) mapped.status=fields.status;
    if(fields.assignedTo!==undefined) mapped.assigned_to=fields.assignedTo;
    if(fields.assignedName!==undefined) mapped.assigned_name=fields.assignedName;
    const { error } = await supabase.from('requests').update(mapped).eq('id',id);
    if(error) throw error;
  }

  async function loadMessages(){
    const { data, error } = await supabase.from('messages').select('*').order('created_at',{ascending:true});
    if(error){ const m=error?.message||error?.code||''; if(m.includes('42P01')||m.includes('does not exist')) console.error('Table messages manquante'); return _cache.messages; }
    const map = {};
    (data||[]).forEach(m=>{
      if(!map[m.chat_id]) map[m.chat_id]={
        id:m.chat_id, participants:m.participants||[], participantNames:m.participant_names||{}, messages:[]
      };
      map[m.chat_id].messages.push({
        id:m.id, from:m.sender_id, text:m.text, time:new Date(m.created_at).getTime(), read:m.read||false
      });
    });
    _cache.messages = Object.values(map);
    return _cache.messages;
  }

  async function insertMessage(chatId, participants, participantNames, msg){
    const { error } = await supabase.from('messages').insert({
      chat_id:chatId, participants, participant_names:participantNames,
      sender_id:msg.from, text:msg.text, read:false, created_at:new Date().toISOString(),
    });
    if(error) throw error;
  }

  async function loadPayments(){
    const { data, error } = await supabase.from('payments').select('*').order('created_at',{ascending:false});
    if(error){ const m=error?.message||error?.code||''; if(m.includes('42P01')||m.includes('does not exist')) console.error('Table payments manquante'); return _cache.payments; }
    _cache.payments = (data||[]).map(p=>({
      id:p.id, userId:p.user_id, userName:p.user_name, userEmail:p.user_email,
      plan:p.plan, planName:p.plan_name, method:p.method, methodName:p.method_name,
      txRef:p.tx_ref, amount:p.amount, status:p.status||'pending',
      createdAt:new Date(p.created_at).getTime(),
      reviewedAt:p.reviewed_at?new Date(p.reviewed_at).getTime():null,
      reviewedBy:p.reviewed_by||null, rejectReason:p.reject_reason||null,
    }));
    return _cache.payments;
  }

  async function insertPayment(pay){
    const { data, error } = await supabase.from('payments').insert({
      user_id:pay.userId, user_name:pay.userName, user_email:pay.userEmail,
      plan:pay.plan, plan_name:pay.planName, method:pay.method, method_name:pay.methodName,
      tx_ref:pay.txRef, amount:pay.amount, status:'pending', created_at:new Date().toISOString(),
    }).select().single();
    if(error) throw error;
    return data;
  }

  async function updatePayment(id, fields){
    const mapped = {};
    if(fields.status!==undefined) mapped.status=fields.status;
    if(fields.reviewedAt!==undefined) mapped.reviewed_at=new Date(fields.reviewedAt).toISOString();
    if(fields.reviewedBy!==undefined) mapped.reviewed_by=fields.reviewedBy;
    if(fields.rejectReason!==undefined) mapped.reject_reason=fields.rejectReason;
    const { error } = await supabase.from('payments').update(mapped).eq('id',id);
    if(error) throw error;
  }

  async function updateProfile(id, fields){
    const mapped = {};
    if(fields.name!==undefined) mapped.name=fields.name;
    if(fields.phone!==undefined) mapped.phone=fields.phone;
    if(fields.location!==undefined) mapped.location=fields.location;
    if(fields.specialty!==undefined) mapped.specialty=fields.specialty;
    if(fields.garageName!==undefined) mapped.garage_name=fields.garageName;
    if(fields.garageLocation!==undefined) mapped.garage_location=fields.garageLocation;
    if(fields.photoUrl!==undefined) mapped.photo_url=fields.photoUrl;
    if(fields.plan!==undefined) mapped.plan=fields.plan;
    if(fields.planStart!==undefined) mapped.plan_start=fields.planStart;
    if(fields.planStatus!==undefined) mapped.plan_status=fields.planStatus;
    if(fields.pendingPlan!==undefined) mapped.pending_plan=fields.pendingPlan;
    if(fields.pendingPaymentId!==undefined) mapped.pending_payment_id=fields.pendingPaymentId;
    if(fields.rating!==undefined) mapped.rating=fields.rating;
    if(fields.completedJobs!==undefined) mapped.completed_jobs=fields.completedJobs;
    const { error } = await supabase.from('profiles').update(mapped).eq('id',id);
    if(error) throw error;
    if(_cache.current?.id===id) _cache.current={..._cache.current,...fields};
    notify();
  }

  async function loadAllProfiles(){
    const { data, error } = await supabase.from('profiles').select('*');
    if(error){ const m=error?.message||error?.code||''; if(m.includes('42P01')||m.includes('does not exist')) console.error('Table profiles manquante'); return _cache.users; }
    const map = {};
    (data||[]).forEach(p=>{ map[p.id]=mapProfile(p); });
    _cache.users = map;
    return map;
  }

  async function deleteProfile(id){
    const { error } = await supabase.from('profiles').delete().eq('id',id);
    if(error) throw error;
    delete _cache.users[id];
    notify();
  }

  let realtimeChannel = null;
  function subscribeRealtime(){
    if(!supabase||realtimeChannel) return;
    try{
      realtimeChannel = supabase.channel('public-changes')
        .on('postgres_changes',{event:'*',schema:'public',table:'requests'},async()=>{ await loadRequests(); notify(); })
        .on('postgres_changes',{event:'*',schema:'public',table:'messages'},async()=>{ await loadMessages(); notify(); })
        .on('postgres_changes',{event:'*',schema:'public',table:'payments'},async()=>{ await loadPayments(); notify(); })
        .on('postgres_changes',{event:'*',schema:'public',table:'profiles'},async()=>{ await loadAllProfiles(); notify(); })
        .subscribe();
    }catch(e){ console.warn('Realtime unavailable:', e?.message||e); }
  }

  return {
    subscribe: fn => { _listeners.push(fn); return ()=>{ _listeners=_listeners.filter(f=>f!==fn); }; },
    notify,
    signUp, signIn, signOut, fetchProfile, updateProfile, deleteProfile, loadAllProfiles,
    loadRequests, insertRequest, updateRequest,
    loadMessages, insertMessage,
    loadPayments, insertPayment, updatePayment,
    subscribeRealtime,
    getUsers:       () => _cache.users,
    getCurrentUser: () => _cache.current,
    setCurrentUser: u  => { _cache.current=u; notify(); },
    getRequests:    () => _cache.requests,
    getMessages:    () => _cache.messages,
    getPayments:    () => _cache.payments,
    setUsers:    u => { _cache.users=u; notify(); },
    setRequests: r => { _cache.requests=r; notify(); },
    setMessages: m => { _cache.messages=m; notify(); },
    setPayments: p => { _cache.payments=p; notify(); },
    isReady:     () => !!supabase,
  };
})();

function daysLeft(createdAt, duration){
  if(!createdAt||!duration) return 0;
  const elapsed=(Date.now()-createdAt)/(1000*60*60*24);
  return Math.max(0,Math.ceil(duration-elapsed));
}
function isPlanActive(user){
  if(!user) return false;
  if(user.role==='admin') return true;
  if(user.planStatus==='pending') return false;
  const plan=PLANS[user.plan];
  if(!plan) return false;
  return daysLeft(user.planStart,plan.duration)>0;
}
function normalizeLocation(loc=''){
  return loc.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s]/g,'').trim();
}
function sameLocality(locA='',locB=''){
  const a=normalizeLocation(locA), b=normalizeLocation(locB);
  if(!a||!b) return false;
  const wa=a.split(/\s+/).filter(w=>w.length>2), wb=b.split(/\s+/).filter(w=>w.length>2);
  return wa.some(x=>wb.some(y=>y.includes(x)||x.includes(y)));
}
function timeAgo(ts){
  const diff=Date.now()-ts, m=Math.floor(diff/60000);
  if(m<1) return 'À l\'instant';
  if(m<60) return `Il y a ${m}min`;
  const h=Math.floor(m/60);
  if(h<24) return `Il y a ${h}h`;
  return new Date(ts).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
}
function requestMatchesTech(req,tech){
  const sp=tech.specialty; if(!sp) return true;
  if(req.techType&&req.techType===sp) return true;
  const ms=BREAKDOWN_SPECIALTY_MAP[req.breakdownType]||[];
  return ms.includes(sp);
}
function ic(name,size=20,color='currentColor'){
  return `<svg width="${size}" height="${size}" style="display:inline-block;flex-shrink:0;vertical-align:middle;color:${color};stroke:${color}"><use href="#ic-${name}"/></svg>`;
}
function avatarHTML(user,size=44){
  if(user?.photoUrl){
    return `<div class="avatar" style="width:${size}px;height:${size}px;border:2px solid rgba(255,107,43,0.3)">\
<img src="${user.photoUrl}" alt=""/></div>`;
  }
  const colors=[['#FF6B2B','#FF4500'],['#3B9EFF','#2563EB'],['#00D37F','#00A062'],['#8B5CF6','#6D28D9'],['#FFB340','#F59E0B']];
  const idx=user?.name?user.name.charCodeAt(0)%colors.length:0;
  const [c1,c2]=colors[idx];
  const letter=(user?.name)?user.name[0].toUpperCase():'?';
  return `<div class="avatar" style="width:${size}px;height:${size}px;background:linear-gradient(135deg,${c1},${c2});font-size:${Math.round(size*0.36)}px;color:#fff">${letter}</div>`;
}
function badge(text,color,solid=false){
  const bg=solid?color:color+'1A';
  const border=color+'33';
  return `<span class="badge" style="background:${bg};color:${solid?'#fff':color};border:1px solid ${border}">${text}</span>`;
}
function tagSpan(text,color){
  return `<span class="tag" style="background:${color}15;color:${color};border:1px solid ${color}25">${text}</span>`;
}
function stars(rating){
  const r=Math.round(rating||0);
  return Array.from({length:5},(_,i)=>`<svg width="12" height="12"><use href="#ic-star" style="color:${i<r?'#FFB340':'#334155'}"/></svg>`).join('');
}

// SOUND
function playNotifSound(type='default'){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const cfgs={
      success:[{f:523,s:0,d:0.1,v:0.3},{f:659,s:0.12,d:0.1,v:0.3},{f:784,s:0.24,d:0.18,v:0.25}],
      alert:  [{f:880,s:0,d:0.08,v:0.35},{f:880,s:0.14,d:0.08,v:0.35},{f:660,s:0.28,d:0.18,v:0.3}],
      message:[{f:880,s:0,d:0.07,v:0.2},{f:1108,s:0.09,d:0.1,v:0.18}],
      default:[{f:660,s:0,d:0.15,v:0.25}],
    };
    (cfgs[type]||cfgs.default).forEach(({f,s,d,v})=>{
      const osc=ctx.createOscillator(),g=ctx.createGain();
      osc.connect(g);g.connect(ctx.destination);osc.type='sine';
      osc.frequency.setValueAtTime(f,ctx.currentTime+s);
      g.gain.setValueAtTime(0,ctx.currentTime+s);
      g.gain.linearRampToValueAtTime(v,ctx.currentTime+s+0.02);
      g.gain.linearRampToValueAtTime(0,ctx.currentTime+s+d);
      osc.start(ctx.currentTime+s);osc.stop(ctx.currentTime+s+d+0.05);
    });
  }catch(e){}
}

    error:  {bg:'rgba(255,61,90,0.95)',border:'rgba(255,61,90,0.3)',icon:'alert'},
    warning:{bg:'rgba(255,179,64,0.95)',border:'rgba(255,179,64,0.3)',icon:'alert'},
    info:   {bg:'rgba(255,107,43,0.95)',border:'rgba(255,107,43,0.3)',icon:'bell'},
  };
  const c=cfg[type]||cfg.info;
  t.style.cssText=`background:${c.bg};border:1px solid ${c.border};border-radius:14px;padding:12px 16px;font-size:13px;font-weight:600;color:#fff;display:flex;align-items:center;gap:10px;box-shadow:0 8px 32px rgba(0,0,0,0.5);backdrop-filter:blur(20px)`;
  t.innerHTML=`${ic(c.icon,16,'#fff')}<span style="flex:1">${msg}</span><button onclick="document.getElementById('toast').style.display='none'" style="background:none;border:none;color:rgba(255,255,255,0.6);cursor:pointer;padding:0">${ic('close',14,'rgba(255,255,255,0.6)')}</button>`;
  t.style.display='flex';
  clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>{ if(t) t.style.display='none'; },4500);
}

var _rendering=false;
async function render(){
  if(_rendering) return;
  _rendering=true;
  try{
    const app=document.getElementById('app');
    APP.user=DB.getCurrentUser();
    if(!APP.user){
      try{
        const { data:{ session } } = await supabase.auth.getSession();
        if(session){ APP.user=await DB.fetchProfile(session.user.id); DB.setCurrentUser(APP.user); }
      }catch(e){}
    }
    if(!APP.user){ app.innerHTML=renderAuthScreen(); bindAuthEvents(); return; }
    if(APP.user.role==='admin'){ app.innerHTML=renderAdminDashboard(); bindAdminEvents(); return; }
    if(APP.user.planStatus==='pending'){ app.innerHTML=renderPendingScreen(); return; }
    if(!isPlanActive(APP.user)){ app.innerHTML=renderExpiredScreen(); bindExpiredEvents(); return; }
    app.innerHTML=renderMainApp();
    bindMainEvents();
  }finally{ _rendering=false; }
}

async function safeLoad(fn, name){
  try{ await fn(); }
  catch(e){
    let msg='';
    try{ msg=String(e?.message||e?.code||''); }catch(_){}
    if(msg&&(msg.includes('does not exist')||msg.includes('42P01'))){
      console.error('Table "'+name+'" manquante.');
    }
  }
}

async function loadAllData(){
  // Charger profiles en priorité, puis le reste en parallèle
  await safeLoad(()=>DB.loadAllProfiles(),'profiles');
  await Promise.all([
    safeLoad(()=>DB.loadRequests(),'requests'),
    safeLoad(()=>DB.loadMessages(),'messages'),
    safeLoad(()=>DB.loadPayments(),'payments'),
  ]);
}

async function loadEssentialData(){
  // Chargement minimal pour afficher l'UI rapidement
  await safeLoad(()=>DB.loadAllProfiles(),'profiles');
}

async function loadBackgroundData(){
  // Chargement du reste en arrière-plan
  await Promise.all([
    safeLoad(()=>DB.loadRequests(),'requests'),
    safeLoad(()=>DB.loadMessages(),'messages'),
    safeLoad(()=>DB.loadPayments(),'payments'),
  ]);
}

function setAuthMode(mode){ authMode=mode; render(); }
function renderAuthRoleFields(){
  const f=document.getElementById('authTechFields');
  if(f) f.style.display=authForm.role==='tech'?'block':'none';
}
function handlePhotoUpload(id,input){
  const file=input.files[0];
  if(!file||!file.type.startsWith('image/')) return;
  if(file.size>2*1024*1024){ showToast('La photo dépasse 2 Mo','error'); return; }
  const r=new FileReader();
  r.onload=ev=>{
    if(id==='authPhoto') authForm.photoUrl=ev.target.result;
    else if(id==='profilePhoto') APP.profileForm.photoUrl=ev.target.result;
    render();
  };
  r.readAsDataURL(file);
}
function clearPhoto(id){
  if(id==='authPhoto') authForm.photoUrl=null;
  else if(id==='profilePhoto') APP.profileForm.photoUrl=null;
  render();
}
function bindAuthEvents(){
  const p=document.getElementById('authPassword');
  if(p) p.addEventListener('keydown',e=>{ if(e.key==='Enter') handleAuthSubmit(); });
  const em=document.getElementById('authEmail');
  if(em) em.addEventListener('keydown',e=>{ if(e.key==='Enter') handleAuthSubmit(); });
}
function handleAuthSubmit(){ authMode==='login'?handleLogin():handleRegister(); }

function handleLogin(){
  const emailRaw=(document.getElementById('authEmail')||{value:authForm.email}).value.trim();
  const email=emailRaw.toLowerCase();
  const pass=(document.getElementById('authPassword')||{value:authForm.password}).value;
  const btn=document.getElementById('authSubmitBtn');
  if(!email||!pass){ showToast('Remplissez tous les champs','error'); return; }

  // ── Connexion via Supabase (admin détecté par role='admin' dans profiles) ──
  if(btn){ btn.disabled=true; btn.innerHTML='⏳ Connexion...'; }
  DB.signIn(email,pass)
    .then(async()=>{ await loadAllData(); render(); })
    .catch(e=>{
      const msg=(e?.message||e?.msg||JSON.stringify(e)||'').toLowerCase();
      const raw=e?.message||e?.msg||JSON.stringify(e)||'Inconnue';
      if(msg.includes('invalid')||msg.includes('credentials')||msg.includes('password')||msg.includes('wrong')){
        showToast('Email ou mot de passe incorrect','error');
      } else if(msg.includes('confirmed')||msg.includes('confirm')||msg.includes('verif')){
        showToast('Confirmez votre email avant de vous connecter','error');
      } else if(msg.includes('fetch')||msg.includes('network')||msg.includes('failed')){
        showToast('Erreur réseau : '+raw,'error');
      } else {
        showToast('Erreur : '+raw,'error');
      }
      if(btn){btn.disabled=false;btn.innerHTML=ic('zap',16,'#fff')+' Se connecter';}
    });
}

function handleRegister(){
  const name=(document.getElementById('authName')||{value:authForm.name}).value.trim();
  const email=(document.getElementById('authEmail')||{value:authForm.email}).value.trim();
  const pass=(document.getElementById('authPassword')||{value:authForm.password}).value;
  const phone=(document.getElementById('authPhone')||{value:authForm.phone}).value.trim();
  const role=(document.getElementById('authRole')||{value:authForm.role}).value;
  const specialty=(document.getElementById('authSpecialty')||{value:authForm.specialty}).value;
  const garageName=(document.getElementById('authGarageName')||{value:authForm.garageName}).value.trim();
  const garageLocation=(document.getElementById('authGarageLocation')||{value:authForm.garageLocation}).value.trim();
  if(!name||!email||!pass){ showToast('Remplissez tous les champs obligatoires','error'); return; }
  if(pass.length<6){ showToast('Mot de passe : 6 caractères minimum','error'); return; }
  if(role==='tech'&&!specialty){ showToast('Choisissez votre spécialité','error'); return; }
  if(role==='tech'&&!garageName){ showToast('Entrez le nom du garage','error'); return; }
  if(role==='tech'&&!garageLocation){ showToast('Entrez la localisation du garage','error'); return; }
  const btn=document.getElementById('authSubmitBtn');
  if(btn){ btn.disabled=true; btn.innerHTML='⏳ Création...'; }
  DB.signUp(email,pass,{
    name,role,phone,specialty,
    garage_name:garageName,garage_location:garageLocation,
    location:role==='tech'?garageLocation:'Lomé, Togo',
    photo_url:role==='tech'?authForm.photoUrl:null,
  }).then(async()=>{
    await loadAllData();
    showToast('Compte créé ! 30 jours d\'essai offerts 🎉','success');
    render();
  }).catch(e=>{
    const msg=e.message||'';
    if(msg.includes('already')) showToast('Email déjà utilisé','error');
    else showToast('Erreur : '+(msg||'Réessayez'),'error');
    if(btn){btn.disabled=false;btn.innerHTML=ic('user',16,'#fff')+' Créer mon compte';}
  });
}

  <div style="background:rgba(255,107,43,0.07);border:1px solid rgba(255,107,43,0.2);border-radius:13px;padding:14px;margin-bottom:14px">

      📲 Envoyez <strong style="color:var(--text)">${selPlan.price.toLocaleString()} CFA</strong> au
      <strong style="color:${selMethod.color}">${selMethod.number}</strong> (${selMethod.name})<br/>
      puis saisissez la <strong style="color:var(--text)">référence de transaction</strong> ci-dessous.
    </p>
  </div>
  <div style="background:rgba(255,255,255,0.04);border-radius:11px;padding:10px 14px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center">
    <span style="color:var(--text2);font-size:13px">Plan sélectionné</span>
    <span style="font-weight:800;color:${selPlan.color}">${selPlan.icon} ${selPlan.name} — ${selPlan.price.toLocaleString()} CFA</span>
  </div>
  <input class="inp" id="payTxRef" placeholder="Référence transaction (ex: TXN123456)" style="margin-bottom:14px" value="${payState.txRef}" oninput="payState.txRef=this.value"/>
  <button class="btn btn-green btn-full" id="paySubmitBtn" onclick="handlePaySubmit()">
    ${ic('send',16,'#fff')} Soumettre le paiement
  </button>
  <p style="text-align:center;color:var(--text3);font-size:11px;margin-top:10px">Activation sous 24h après validation admin.</p>`;
}

function reRenderPayModal(){
  const modal=document.getElementById('paymentModal');
  if(modal){ modal.outerHTML=renderPaymentModal(); bindPaymentModalEvents(); }
  else render();
}
function openPaymentModal(){
  const defaultPlan=APP.user&&APP.user.role==='tech'?'tech_sub':'basic';
  payState={step:1,plan:defaultPlan,method:'tmoney',txRef:''};
  const m=document.getElementById('paymentModal');
  if(m) m.classList.add('open');
}
function closePaymentModal(){ const m=document.getElementById('paymentModal'); if(m) m.classList.remove('open'); }
function bindPaymentModalEvents(){
  const m=document.getElementById('paymentModal');
  if(m) m.addEventListener('click',e=>{ if(e.target===m) closePaymentModal(); });
}
function handlePaySubmit(){
  const txRef=(document.getElementById('payTxRef')||{value:payState.txRef}).value.trim();
  if(!txRef){ showToast('Entrez la référence de transaction','error'); return; }
  const user=APP.user;
  const selMethod=PAYMENT_METHODS.find(m=>m.id===payState.method);
  const btn=document.getElementById('paySubmitBtn');
  if(btn){ btn.disabled=true; btn.innerHTML='⏳ Envoi...'; }
  DB.insertPayment({
    userId:user.id, userName:user.name, userEmail:user.email,
    plan:payState.plan, planName:PLANS[payState.plan].name,
    method:payState.method, methodName:selMethod.name,
    txRef, amount:PLANS[payState.plan].price,
  }).then(async saved=>{
    await DB.updateProfile(user.id,{pendingPlan:payState.plan,pendingPaymentId:saved.id,planStatus:'pending'});
    await loadAllData();
    showToast('Paiement soumis ! En attente de validation.','warning');
    render();
  }).catch(e=>{ showToast('Erreur lors de la soumission','error'); if(btn){btn.disabled=false;btn.innerHTML=ic('send',16,'#fff')+' Soumettre le paiement';} });
}

function renderPaymentCard(p,users,readonly){

  const sl={pending:'⏳ En attente',approved:'✅ Approuvé',rejected:'❌ Rejeté'}[p.status];
  const pc=PLANS[p.plan]?.color||'#64748B';
  return `
  <div class="card" style="margin-bottom:10px;border-color:${sc}22">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">

        ${avatarHTML(u||{name:p.userName},40)}
        <div><div style="font-weight:700">${p.userName}</div><div style="color:var(--text2);font-size:12px">${p.userEmail}</div></div>
      </div>

      ${[['Plan',`<span style="color:${pc};font-weight:700">${p.planName}</span>`],['Montant',`<span style="color:var(--green);font-weight:700">${p.amount.toLocaleString()} CFA</span>`],['Méthode',p.methodName],['Réf. TX',`<strong style="color:var(--text)">${p.txRef}</strong>`],['Soumis',timeAgo(p.createdAt)],p.reviewedAt?['Traité',timeAgo(p.reviewedAt)]:null].filter(Boolean).map(([k,v])=>`
      <div style="background:rgba(255,255,255,0.03);border-radius:9px;padding:9px 11px;border:1px solid var(--border2)"><div style="color:var(--text3);font-size:10px;font-weight:700;text-transform:uppercase;margin-bottom:3px">${k}</div><div>${v}</div></div>`).join('')}
    </div>
    ${p.rejectReason?`<div style="background:rgba(255,61,90,0.07);border:1px solid rgba(255,61,90,0.2);border-radius:9px;padding:10px;margin-bottom:10px;font-size:12px;color:var(--red)">Motif : ${p.rejectReason}</div>`:''}
    ${!readonly&&p.status==='pending'?`
    <div style="display:flex;gap:8px;margin-top:4px">
      <button class="btn btn-sm" style="background:rgba(255,61,90,0.1);color:var(--red);border:1px solid rgba(255,61,90,0.2);flex:1" onclick="APP.confirmModal={type:'reject',payment:${JSON.stringify(p).replace(/"/g,'&quot;')}};render()">❌ Rejeter</button>

    </div>`:''}

function bindAdminEvents(){
  const m=document.getElementById('adminConfirmModal');
  if(m) m.addEventListener('click',e=>{ if(e.target===m){APP.confirmModal=null;render();} });
}

function adminApprovePayment(){
  const p=APP.confirmModal.payment;
  DB.updatePayment(p.id,{status:'approved',reviewedAt:Date.now(),reviewedBy:'admin'})
    .then(()=>DB.updateProfile(p.userId,{plan:p.plan,planStart:Date.now(),planStatus:'active',pendingPlan:null,pendingPaymentId:null}))
    .then(()=>loadAllData())
    .then(()=>{ APP.confirmModal=null; showToast(`✅ Plan ${p.planName} activé pour ${p.userName}`,'success'); render(); })
    .catch(e=>showToast('Erreur : '+(e.message||e),'error'));
}
function adminRejectPayment(){
  const p=APP.confirmModal.payment;
  const reason=APP.rejectReason||'';
  DB.updatePayment(p.id,{status:'rejected',reviewedAt:Date.now(),reviewedBy:'admin',rejectReason:reason})
    .then(()=>DB.updateProfile(p.userId,{planStatus:'active',plan:'free',pendingPlan:null,pendingPaymentId:null}))
    .then(()=>loadAllData())
    .then(()=>{ APP.confirmModal=null; APP.rejectReason=''; showToast(`❌ Paiement de ${p.userName} rejeté`,'warning'); render(); })
    .catch(e=>showToast('Erreur : '+(e.message||e),'error'));
}
function adminDeleteUser(uid){
  if(!confirm('Supprimer cet utilisateur ?')) return;
  DB.deleteProfile(uid).then(()=>loadAllData()).then(()=>{ showToast('Utilisateur supprimé','info'); render(); })
    .catch(e=>showToast('Erreur : '+(e.message||e),'error'));
}

function handleAcceptMission(req){
  const user=APP.user;
  DB.updateRequest(req.id,{status:'assigned',assignedTo:user.id,assignedName:user.name})
    .then(async()=>{
      const chatId=`chat_${req.userId}_${user.id}`;
      const existing=DB.getMessages().find(m=>m.id===chatId);
      if(!existing){
        await DB.insertMessage(chatId,[req.userId,user.id],{[req.userId]:req.userName,[user.id]:user.name},
          {from:user.id,text:`Bonjour ! Je suis ${user.name} (${user.specialty||'Technicien'}). J'ai pris en charge votre demande et j'arrive. 🔧`});
      }
      await loadAllData();
      if(req.lat&&req.lng){
        const mapsUrl=`https://maps.google.com/?q=${req.lat},${req.lng}`;
        const waUrl=req.userPhone?`https://wa.me/${req.userPhone.replace(/\D/g,'')}?text=${encodeURIComponent('Bonjour, je suis '+user.name+' ('+user.specialty+'). J\'ai accepté votre demande et suis en route !')}`:null;
        APP.confirmModal={message:`Client : <strong>${req.userName}</strong><br/>Panne : <strong>${req.breakdownType}</strong>`,mapsUrl,waUrl};
        render(); return;
      }
      showToast('Mission acceptée ! ✅','success'); render();
    })
    .catch(e=>showToast('Erreur : '+(e.message||e),'error'));
}

function handleCompleteRequest(id){
  DB.updateRequest(id,{status:'resolved'})
    .then(()=>loadAllData())
    .then(()=>{ showToast('Mission marquée comme terminée ✅','success'); render(); })
    .catch(e=>showToast('Erreur : '+(e.message||e),'error'));
}

function openNewRequest(){
  const user=APP.user;
  newReqForm={breakdownType:'',techType:'',location:user.location||'Lomé, Togo',description:'',urgency:'normal',lat:null,lng:null};
  newReqOpen=true; render();
  setTimeout(()=>{ document.getElementById('newReqModal')?.classList.add('open'); },50);
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(pos=>{
      newReqForm.lat=pos.coords.latitude; newReqForm.lng=pos.coords.longitude;
      const btn=document.getElementById('gpsLocBtn');
      if(btn) btn.innerHTML=`${ic('check',13,'var(--green)')} Position GPS capturée : ${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`;
    },()=>{
      const btn=document.getElementById('gpsLocBtn');
      if(btn) btn.innerHTML=`⚠️ GPS non disponible — localisation manuelle`;
    },{enableHighAccuracy:true,timeout:9000});
  }
}

function closeNewRequest(){ newReqOpen=false; document.getElementById('newReqModal')?.classList.remove('open'); setTimeout(()=>render(),220); }
function bindNewRequestModalEvents(){
  const m=document.getElementById('newReqModal');
  if(m) m.addEventListener('click',e=>{ if(e.target===m) closeNewRequest(); });
}

function submitNewRequest(){
  const user=APP.user;
  if(!newReqForm.breakdownType||!newReqForm.techType) return;
  const btn=document.querySelector('#newReqModal .btn-red');
  if(btn){btn.disabled=true;btn.innerHTML='⏳ Envoi en cours...';}
  DB.insertRequest({...newReqForm,userId:user.id,userName:user.name,userPhone:user.phone||''})
    .then(async()=>{
      await loadAllData();
      const allUsers=DB.getUsers();
      const matchTechs=Object.values(allUsers).filter(u=>u.role==='tech'&&isPlanActive(u)&&sameLocality(u.location,newReqForm.location)&&requestMatchesTech(newReqForm,u));
      if(matchTechs.length>0&&matchTechs[0].phone){
        const t=matchTechs[0];
        const posText=newReqForm.lat&&newReqForm.lng?`https://maps.google.com/?q=${newReqForm.lat},${newReqForm.lng}`:newReqForm.location;
        const waMsg=encodeURIComponent(`🆘 Nouvelle demande Panne Solution !\nType: ${newReqForm.breakdownType}\nPosition: ${posText}\nUrgence: ${newReqForm.urgency==='urgent'?'🔴 URGENT':'Normal'}\nClient: ${user.name}\nTél: ${user.phone||'Non renseigné'}`);
        setTimeout(()=>window.open(`https://wa.me/${t.phone.replace(/\D/g,'')}?text=${waMsg}`,'_blank'),400);
      }
      newReqOpen=false;
      showToast('Demande envoyée ! Les techniciens sont alertés 🆘','success');
      render();
    })
    .catch(e=>{ showToast('Erreur lors de l\'envoi','error'); if(btn){btn.disabled=false;btn.innerHTML='🆘 Envoyer la demande d\'aide';} });
}

function initLeaflet(){
  const L=window.L;
  if(!L) return;
  const mapEl=document.getElementById('leafletMap');
  if(!mapEl) return;
  if(leafletInstance){ leafletInstance.invalidateSize(); updateLeafletMarkers(); return; }
  const DEFAULT=[6.1375,1.2123];
  const map=L.map(mapEl,{center:DEFAULT,zoom:13,zoomControl:false});
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{attribution:'© OpenStreetMap © CARTO',maxZoom:19}).addTo(map);
  L.control.zoom({position:'topright'}).addTo(map);
  leafletInstance=map;
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(pos=>{
      userCoords=[pos.coords.latitude,pos.coords.longitude];
      const ui=L.divIcon({html:`<div style="width:16px;height:16px;background:#3B9EFF;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 8px rgba(59,158,255,0.2)"></div>`,className:'',iconSize:[16,16],iconAnchor:[8,8]});
      L.marker(userCoords,{icon:ui}).addTo(map).bindPopup('<strong>📍 Vous êtes ici</strong>');
      map.setView(userCoords,13);
    },()=>{},{ enableHighAccuracy:true,timeout:9000 });
  }
  updateLeafletMarkers();
}

function updateLeafletMarkers(){
  if(!leafletInstance) return;
  const L=window.L;
  leafletMarkers.forEach(m=>m.remove()); leafletMarkers=[];
  const requests=DB.getRequests();
  const DEFAULT=[6.1375,1.2123];
  requests.filter(r=>r.status==='open').forEach(req=>{
    let lat,lng;
    if(req.lat&&req.lng){ lat=req.lat; lng=req.lng; }
    else{
      const s1=(req.id.charCodeAt(2)||1)/255, s2=(req.id.charCodeAt(3)||1)/255;
      lat=DEFAULT[0]+(s1-0.5)*0.06; lng=DEFAULT[1]+(s2-0.5)*0.06;
    }
    const color=req.urgency==='urgent'?'#FF3D5A':'#FFB340';
    const ic2=L.divIcon({html:`<div style="background:${color};width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid rgba(255,255,255,0.9);box-shadow:0 3px 12px rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center"><span style="transform:rotate(45deg);font-size:13px">${req.urgency==='urgent'?'🔴':'🟡'}</span></div>`,className:'',iconSize:[34,34],iconAnchor:[17,34],popupAnchor:[0,-36]});
    const m=L.marker([lat,lng],{icon:ic2}).addTo(leafletInstance).bindPopup(`<div style="font-family:sans-serif;min-width:180px"><strong style="color:#FF6B2B">${req.breakdownType}</strong><br/><span style="color:#64748B;font-size:12px">📍 ${req.location}</span><br/><span style="color:#64748B;font-size:12px">👤 ${req.userName}</span>${req.urgency==='urgent'?'<br/><span style="color:#FF3D5A;font-weight:700">🔴 URGENT</span>':''}</div>`);
    leafletMarkers.push(m);
  });
}
function centerMap(){ if(leafletInstance) leafletInstance.setView(userCoords||[6.1375,1.2123],14); }

function sendChatMessage(){
  const input=document.getElementById('chatInput');
  if(!input) return;
  const text=input.value.trim();
  if(!text||!APP.activeChat) return;
  const user=APP.user;
  const messages=DB.getMessages();
  const current=messages.find(m=>m.id===APP.activeChat);
  if(!current) return;
  input.value='';
  // Optimistic update
  const newMsg={id:Date.now()+'',from:user.id,text,time:Date.now(),read:false};
  const optimistic={...current,messages:[...current.messages,newMsg]};
  DB.setMessages(messages.map(m=>m.id===APP.activeChat?optimistic:m));
  // Update DOM without full re-render
  const allUsers=DB.getUsers();
  const otherId=optimistic.participants.find(p=>p!==user.id);
  const otherName=optimistic.participantNames?.[otherId]||'Inconnu';
  const otherUser=allUsers?.[otherId];
  const msgsEl=document.getElementById('chatMsgs');
  if(msgsEl){
    const div=document.createElement('div');
    div.style.cssText='display:flex;justify-content:flex-end;align-items:flex-end;gap:8px';
    div.innerHTML=`<div class="msg-bubble msg-me"><div>${text}</div><div class="msg-time">${new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</div></div>`;
    const end=document.getElementById('chatEnd');
    if(end) msgsEl.insertBefore(div,end);
    document.getElementById('chatEnd')?.scrollIntoView({behavior:'smooth'});
  }
  DB.insertMessage(APP.activeChat,current.participants,current.participantNames,{from:user.id,text})
    .catch(e=>showToast('Erreur d\'envoi','error'));
}

function saveProfile(){
  const user=APP.user;
  const updates={
    name:APP.profileForm.name||user.name, phone:APP.profileForm.phone||'',
    location:APP.profileForm.garageLocation||APP.profileForm.location||user.location||'',
    specialty:APP.profileForm.specialty||user.specialty||'',
    garageName:APP.profileForm.garageName||user.garageName||'',
    garageLocation:APP.profileForm.garageLocation||user.garageLocation||'',
    photoUrl:APP.profileForm.photoUrl!==undefined?APP.profileForm.photoUrl:user.photoUrl,
  };
  DB.updateProfile(user.id,updates)
    .then(async()=>{
      await loadAllData();
      APP.user={...user,...updates}; DB.setCurrentUser(APP.user);
      APP.profileEditing=false; APP.profileForm={};
      showToast('Profil mis à jour ✅','success'); render();
    })
    .catch(e=>showToast('Erreur : '+(e.message||e),'error'));
}

var SQL_SCRIPT = `-- 1. TABLE PROFILES
create table if not exists profiles (
  id uuid primary key references auth.users on delete cascade,
  email text, name text, role text default 'driver',
  phone text, specialty text, garage_name text, garage_location text,
  location text, photo_url text,
  plan text default 'free', plan_start bigint, plan_status text default 'active',
  pending_plan text, pending_payment_id text, joined_at bigint,
  rating float default 0, completed_jobs int default 0,
  created_at timestamptz default now()
);
alter table profiles enable row level security;
create policy if not exists "Public read" on profiles for select using (true);
create policy if not exists "Own insert" on profiles for insert with check (auth.uid() = id);
create policy if not exists "Own update" on profiles for update using (auth.uid() = id);

-- 2. TABLE REQUESTS
create table if not exists requests (
  id uuid primary key default gen_random_uuid(),
  breakdown_type text, tech_type text, location text,
  description text, urgency text default 'normal',
  user_id uuid, user_name text, user_phone text,
  status text default 'open', assigned_to uuid, assigned_name text,
  lat float, lng float, created_at timestamptz default now()
);
alter table requests enable row level security;
create policy if not exists "All read" on requests for select using (true);
create policy if not exists "Auth insert" on requests for insert with check (auth.role() = 'authenticated');
create policy if not exists "Auth update" on requests for update using (auth.role() = 'authenticated');

-- 3. TABLE MESSAGES
create table if not exists messages (
  id uuid primary key default gen_random_uuid(),
  chat_id text, participants uuid[], participant_names jsonb,
  sender_id uuid, text text, read boolean default false,
  created_at timestamptz default now()
);
alter table messages enable row level security;
create policy if not exists "Auth all" on messages for all using (auth.role() = 'authenticated');

-- 4. TABLE PAYMENTS
create table if not exists payments (
  id uuid primary key default gen_random_uuid(),
  user_id uuid, user_name text, user_email text,
  plan text, plan_name text, method text, method_name text,
  tx_ref text, amount int, status text default 'pending',
  reviewed_at timestamptz, reviewed_by text, reject_reason text,
  created_at timestamptz default now()
);
alter table payments enable row level security;
create policy if not exists "Auth all" on payments for all using (auth.role() = 'authenticated');

-- 5. Activer Realtime
alter publication supabase_realtime add table profiles;
alter publication supabase_realtime add table requests;
alter publication supabase_realtime add table messages;
alter publication supabase_realtime add table payments;`;

  return `

    <div style="width:100%;max-width:460px">

        <div class="logo-mark" style="width:64px;height:64px;border-radius:20px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center">${ic('wrench',30,'#fff')}</div>
        <h1 style="font-size:24px;font-weight:900;margin:0 0 6px">Panne Solution</h1>
        <p style="color:var(--text2);font-size:14px">Configuration de la base de données</p>
      </div>

        <div style="background:rgba(0,211,127,0.07);border:1px solid rgba(0,211,127,0.2);border-radius:12px;padding:14px;margin-bottom:20px;font-size:13px;color:#6EE7B7;line-height:1.8">

          3. Copiez <strong>Project URL</strong> et la clé <strong>anon / public</strong> (commence par <code style="background:rgba(0,0,0,0.3);padding:1px 5px;border-radius:4px">eyJ...</code>)

        <input class="inp" id="ks_url" placeholder="https://xxxx.supabase.co" style="margin-bottom:14px" value="${SUPA_URL||''}"/>
        <label style="display:block;font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:6px">Clé anon (commence par eyJ...)</label>
        <input class="inp" id="ks_key" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..." style="margin-bottom:20px" value="${SUPA_KEY&&SUPA_KEY.startsWith('eyJ')?SUPA_KEY:''}"/>
        <button class="btn btn-primary btn-full" id="ks_btn" onclick="handleKeySetupSubmit()">
          ${ic('zap',16,'#fff')} Connecter
        </button>
      </div>

async function handleKeySetupSubmit(){
  const url = (document.getElementById('ks_url')||{value:''}).value.trim();
  const key = (document.getElementById('ks_key')||{value:''}).value.trim();
  const btn = document.getElementById('ks_btn');
  if(!url || !key){ showToast('Remplissez les deux champs','error'); return; }
  if(!url.includes('supabase.co')){ showToast("L'URL doit contenir supabase.co",'error'); return; }
  if(!key.startsWith('eyJ')){ showToast("La clé doit commencer par eyJ... (clé anon JWT)",'error'); return; }
  if(btn){ btn.disabled=true; btn.innerHTML='⏳ Test de connexion...'; }
  // Tester la connexion
  try{
    await loadSupabaseSDK();
    SUPA_URL = url; SUPA_KEY = key;
    supabase = window.supabase.createClient(url, key, { auth:{ persistSession:true, autoRefreshToken:true } });
    // Test réel : lire profiles
    const { error } = await supabase.from('profiles').select('id').limit(1);
    if(error && (error.message||'').includes('Failed to fetch')){
      throw new Error('Connexion échouée — vérifiez l’URL et la clé');
    }
    // Sauvegarder
    localStorage.setItem('ps_supa_url', url);
    localStorage.setItem('ps_supa_key', key);
    showToast('Connexion réussie ! ✅','success');
    // Boot suite
    await bootAfterInit();
  } catch(e){
    const msg = e?.message || String(e);
    if(btn){ btn.disabled=false; btn.innerHTML=ic('zap',16,'#fff')+' Connecter'; }
    document.getElementById('app').innerHTML = renderKeySetupScreen(msg);
    bindKeySetupEvents();
  }
}

function bindKeySetupEvents(){
  const k = document.getElementById('ks_key');
  if(k) k.addEventListener('keydown', e=>{ if(e.key==='Enter') handleKeySetupSubmit(); });
}

async function bootAfterInit(){
  try{
    // 1. Session + profiles en priorité → affiche l'UI rapidement
    const { data:{ session } } = await supabase.auth.getSession();
    if(session){
      try{
        const p = await DB.fetchProfile(session.user.id);
        DB.setCurrentUser(p);
      }catch(e){ console.warn('fetchProfile:', e?.message); }
    }
    await loadEssentialData();

    // 2. Afficher l'UI immédiatement
    render();

    // 3. Charger le reste en arrière-plan
    loadBackgroundData().then(()=>{
      DB.subscribeRealtime();
      render(); // Re-render avec toutes les données
    });

  } catch(e){
    console.warn('bootAfterInit error:', e?.message||String(e));
    render();
  }

  supabase.auth.onAuthStateChange(async(event, session)=>{
    if(event==='SIGNED_IN' && session){
      try{
        const p=await DB.fetchProfile(session.user.id);
        DB.setCurrentUser(p);
        await loadEssentialData();
        render();
        loadBackgroundData().then(()=>render());
      }catch(e){}
    } else if(event==='SIGNED_OUT'){
      DB.setCurrentUser(null); render();
    }
  });
}

Object.assign(window, { handleKeySetupSubmit, bindKeySetupEvents });

// ═══════════════════════════════════════════════════════════
//  BOOT — charge le SDK puis vérifie la clé anon
// ═══════════════════════════════════════════════════════════
(async()=>{
  // Splash
  document.getElementById('app').innerHTML=`
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:var(--bg)">
    <div class="logo-mark" style="width:60px;height:60px;border-radius:18px;animation:glow 2s ease-in-out infinite">${ic('wrench',28,'#fff')}</div>
    <div class="spinner"></div>
    <div style="color:var(--text2);font-size:13px;font-weight:600">${APP_NAME}</div>
  </div>`;

  // 1. Charger le SDK Supabase
  try{ await loadSupabaseSDK(); }
  catch(e){
    document.getElementById('app').innerHTML=`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)"><div class="card" style="max-width:380px;text-align:center"><div style="font-size:48px;margin-bottom:12px">❌</div><h2 style="color:var(--red);margin:0 0 10px">Pas de connexion</h2><p style="color:var(--text2);margin-bottom:16px">Impossible de charger le SDK. Vérifiez votre connexion internet.</p><button class="btn btn-primary btn-full" onclick="location.reload()">🔄 Réessayer</button></div></div>`;
    return;
  }

  // 2. Vérifier que la clé est une clé JWT anon valide (commence par eyJ)
  if(!SUPA_KEY || !SUPA_KEY.startsWith('eyJ')){
    document.getElementById('app').innerHTML = renderKeySetupScreen(
      SUPA_KEY ? 'La clé fournie n’est pas une clé anon JWT. Elle doit commencer par eyJ... (pas sb_publishable_...)' : null
    );
    bindKeySetupEvents();
    return;
  }

  // 3. Initialiser le client
  if(!initSupabase()){
    document.getElementById('app').innerHTML = renderKeySetupScreen('Erreur d’initialisation du client Supabase.');
    bindKeySetupEvents();
    return;
  }

  // 4. Boot normal — on laisse Supabase gérer les erreurs réseau
  await bootAfterInit();
})();
</script>
